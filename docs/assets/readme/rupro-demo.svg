<style>
@media (prefers-reduced-motion:no-preference){
.signal{animation:travel 6s linear infinite}
.top{animation:lift 3.7s ease-in-out infinite}
.middle{animation:lift 3.7s -.2s ease-in-out infinite;animation-name:mid}
.play{animation:advance 4s ease-in-out infinite}
@keyframes travel{to{stroke-dashoffset:-284}}
@keyframes lift{0%,90%,100%{transform:translateY(0)}45%{transform:translateY(-5px)}}
@keyframes mid{0%,90%,100%{transform:translateY(0)}45%{transform:translateY(-2px)}}
@keyframes advance{0%,15%,75%,100%{transform:translateX(0)}45%{transform:translateX(3px)}}
}
</style>
