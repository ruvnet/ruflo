<text x="20" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f6f5fb">Plan the change</text>
<g class="row" style="animation-delay:-20.45s">
<circle cx="24" cy="251" r="3" fill="#b69af5"/>
<text x="38" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Claude traces a timeout.</text>
</g>
<g class="row" style="animation-delay:-19.60s">
<circle cx="24" cy="290" r="3" fill="#b69af5"/>
<text x="38" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Set a limit of three attempts.</text>
</g>
<g class="row" style="animation-delay:-18.75s">
<circle cx="24" cy="329" r="3" fill="#b69af5"/>
<text x="38" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Codex implements backoff.</text>
</g>
</g>
<g class="panel " style="animation-delay:-15.6s">
<text x="20" y="171" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#91dfea">2 / 4     Terminal</text>
<text x="20" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f6f5fb">Test the retry path</text>
<g class="row" style="animation-delay:-15.25s">
<circle cx="24" cy="251" r="3" fill="#b69af5"/>
<text x="38" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">$ npm test</text>
</g>
<g class="row" style="animation-delay:-14.40s">
<circle cx="24" cy="290" r="3" fill="#b69af5"/>
<text x="38" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Timeout → retry → success</text>
</g>
<g class="row" style="animation-delay:-13.55s">
<circle cx="24" cy="329" r="3" fill="#b69af5"/>
<text x="38" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">12 checks passed. Exit code 0.</text>
</g>
</g>
<g class="panel " style="animation-delay:-10.4s">
<text x="20" y="171" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#91dfea">3 / 4     Review</text>
<text x="20" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f6f5fb">Review the evidence</text>
<g class="row" style="animation-delay:-10.05s">
<circle cx="24" cy="251" r="3" fill="#b69af5"/>
<text x="38" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Open the patch and test log.</text>
</g>
<g class="row" style="animation-delay:-9.20s">
<circle cx="24" cy="290" r="3" fill="#b69af5"/>
<text x="38" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Compare 1 attempt with 3.</text>
</g>
<g class="row" style="animation-delay:-8.35s">
<circle cx="24" cy="329" r="3" fill="#b69af5"/>
<text x="38" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Owner approves R42.</text>
</g>
</g>
<g class="panel last" style="animation-delay:-5.2s">
<text x="20" y="171" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#91dfea">4 / 4     Analytics</text>
<text x="20" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f6f5fb">Record the outcome</text>
<g class="row" style="animation-delay:-4.85s">
<circle cx="24" cy="251" r="3" fill="#b69af5"/>
<text x="38" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">1 fix approved</text>
</g>
<g class="row" style="animation-delay:-4.00s">
<circle cx="24" cy="290" r="3" fill="#b69af5"/>
<text x="38" y="296" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">12 passing checks attached</text>
</g>
<g class="row" style="animation-delay:-3.15s">
<circle cx="24" cy="329" r="3" fill="#b69af5"/>
<text x="38" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6f5fb">Decision saved to R42.</text>
</g>
</g>
<path d="M20 354h320" stroke="#41364f"/>
<text x="20" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#b7accb">Simulated workspace</text>
