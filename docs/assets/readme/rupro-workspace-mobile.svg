<svg xmlns="http://www.w3.org/2000/svg" width="360" height="408" viewBox="0 0 360 408" role="img" aria-labelledby="t d"><title id="t">ruPro · Retry policy walkthrough</title><desc id="d">Sample issue R42 moves from agent planning to tests, owner approval and a recorded decision.</desc><style>.panel{opacity:0}.last{opacity:1}@media(prefers-reduced-motion:no-preference){.panel{animation:panel 20.8s steps(1,end) infinite}.row{animation:row 20.8s linear infinite}@keyframes panel{0%,24.99%{opacity:1}25%,100%{opacity:0}}@keyframes row{0%{opacity:0}1%,25%{opacity:1}26%,100%{opacity:0}}}</style>
<rect x=".7" y=".7" width="358.6" height="406.6" rx="14" fill="#10101a" stroke="#594a69"/>
<text x="20" y="33" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#cfb9fc">ruPro   /   EARLY ACCESS</text>
<text x="20" y="85" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#f6f5fb">One agent workspace</text>
<text x="20" y="115" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#b7accb">R42   /   Retry policy</text>
<path d="M20 139h320" stroke="#41364f"/>
<g class="panel " style="animation-delay:-20.8s">
