<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
<title id="t">Weighted load balancing: a weight of 0 now means no tasks</title>
<desc id="d">Before 3.80.10, an agent given weight 0 was treated as weight 1 and still received tasks. Now weight 0 means it receives none.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}
.t1{font-size:15px;font-weight:600;fill:#e6edf3}
.lb{font-size:11px;font-weight:700;fill:#8b949e;letter-spacing:.08em}
.tx{font-size:13px;fill:#c9d1d9}
.mu{fill:#8b949e}.r{fill:#f85149}.g{fill:#3fb950}.b{fill:#58a6ff}
.old{animation:old 8s infinite both}.now{animation:now 8s infinite both}
@keyframes old{0%,46%{opacity:1}50%,96%{opacity:0}100%{opacity:1}}
@keyframes now{0%,46%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
.rv{animation:rv 4s infinite both}
@keyframes rv{0%{opacity:0}8%,100%{opacity:1}}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.dot{animation-duration:2s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}.ta{animation-name:ta}.tb{animation-name:tb}.tc{animation-name:tc}@keyframes ta{0%{transform:translate(0,0);opacity:0}10%,85%{opacity:1}100%{transform:translate(296px,-53px);opacity:0}}@keyframes tb{0%{transform:translate(0,0);opacity:0}10%,85%{opacity:1}100%{transform:translate(296px,-1px);opacity:0}}@keyframes tc{0%{transform:translate(0,0);opacity:0}10%,85%{opacity:1}100%{transform:translate(296px,51px);opacity:0}}
@media (prefers-reduced-motion:reduce){.old{animation:none;opacity:0}.now,.rv,.flow,.fly,.beam,.dot{animation:none;opacity:1}}
</style>
<rect class="bg" width="720" height="250" rx="12"/>
<g class="old"><rect x="568" y="14" width="128" height="24" rx="12" fill="#f8514922" stroke="#f85149"/><text x="632" y="30" text-anchor="middle" class="lb r">BEFORE</text></g>
<g class="now"><rect x="568" y="14" width="128" height="24" rx="12" fill="#3fb95022" stroke="#3fb950"/><text x="632" y="30" text-anchor="middle" class="lb g">NOW · 3.80.10</text></g>
<text x="24" y="34" class="t1">Weighted load balancing, agent C has weight 0</text>
<rect class="card" x="24" y="95" width="150" height="60" rx="8"/><text x="99" y="120" text-anchor="middle" class="lb">BALANCER</text><text x="99" y="140" text-anchor="middle" class="tx mu" style="font-size:12px">new tasks</text>
<line x1="174" y1="125" x2="470" y2="72" stroke="#30363d"/><rect class="card" x="470" y="52" width="226" height="40" rx="8"/><text x="482" y="77" class="m tx">agent A  weight 2</text><line x1="174" y1="125" x2="470" y2="124" stroke="#30363d"/><rect class="card" x="470" y="104" width="226" height="40" rx="8"/><text x="482" y="129" class="m tx">agent B  weight 1</text><line x1="174" y1="125" x2="470" y2="176" stroke="#30363d"/><rect class="card" x="470" y="156" width="226" height="40" rx="8"/><text x="482" y="181" class="m tx">agent C  weight 0</text>
<g class="old"><circle class="dot ta" style="animation-delay:0s" cx="174" cy="125" r="5" fill="#58a6ff"/><circle class="dot ta" style="animation-delay:1s" cx="174" cy="125" r="5" fill="#58a6ff"/><circle class="dot tb" style="animation-delay:0.5s" cx="174" cy="125" r="5" fill="#58a6ff"/><circle class="dot tc" style="animation-delay:1.5s" cx="174" cy="125" r="5" fill="#f85149"/><text x="688" y="181" text-anchor="end" class="tx r">✗ busy</text>
<text x="24" y="234" class="tx r">Before: weight 0 was read as 1, so agent C still got tasks.</text></g>
<g class="now"><circle class="dot ta" style="animation-delay:0s" cx="174" cy="125" r="5" fill="#58a6ff"/><circle class="dot ta" style="animation-delay:1s" cx="174" cy="125" r="5" fill="#58a6ff"/><circle class="dot tb" style="animation-delay:0.5s" cx="174" cy="125" r="5" fill="#58a6ff"/><text x="688" y="181" text-anchor="end" class="tx g">✓ idle</text>
<text x="24" y="234" class="tx g">Now: weight 0 means no tasks, and A gets twice B's share.</text></g>
</svg>
