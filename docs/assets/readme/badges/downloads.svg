<title id="t">npm downloads: 120.95M observed since October 2025</title>
<desc id="d">120,946,147 observed npm download events since 2025-10-01, 429 package cohort, evidence through 2026-11-15. Observed lower bound with historical gaps, not unique users or lifetime downloads. No animated counter increments are claimed.</desc>
