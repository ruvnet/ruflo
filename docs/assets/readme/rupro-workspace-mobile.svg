    <g class="line" style="--lag:0.8500000000000001s"><path d="M20 192v16" stroke="#efc38d" stroke-width="2"/><text x="29" y="205" font-size="13" fill="#efc38d">−</text><text x="98" y="205" font-size="16" fill="#e7e4ec">maxAttempts = 1</text></g>
    <g class="line" style="--lag:1.4000000000000001s"><path d="M20 228v16" stroke="#8ee2b2" stroke-width="2"/><text x="29" y="241" font-size="13" fill="#8ee2b2">+</text><text x="98" y="241" font-size="16" fill="#e7e4ec">maxAttempts = 3</text></g>
    <g class="line" style="--lag:1.9500000000000002s"><path d="M20 264v16" stroke="#cbb3ff" stroke-width="2"/><text x="29" y="277" font-size="13" fill="#cbb3ff">REVIEW</text><text x="98" y="277" font-size="16" fill="#e7e4ec">Owner approved R42.</text></g>
    <path d="M180 362h76" stroke="#ba9af8" stroke-width="3"/>
  </g>
  <g class="scene " style="--offset:-6s">
