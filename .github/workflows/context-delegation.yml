name: Bounded context delegation contracts
on:
  pull_request:
    paths:
      - 'v3/@claude-flow/cli/src/services/context-delegation.ts'
      - 'v3/@claude-flow/cli/src/commands/context-plan.ts'
      - 'v3/@claude-flow/cli/src/commands/hooks.ts'
      - 'v3/@claude-flow/cli/src/index.ts'
      - 'v3/@claude-flow/cli/__tests__/context-delegation.test.ts'
      - 'v3/@claude-flow/cli/tsconfig.context-delegation.json'
      - 'v3/@claude-flow/cli/benchmarks/context-delegation/**'
      - '.github/workflows/context-delegation.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: node_modules/.bin/tsc -p v3/@claude-flow/cli/tsconfig.context-delegation.json
      - run: ../../../node_modules/.bin/vitest run __tests__/context-delegation.test.ts
        working-directory: v3/@claude-flow/cli
      - name: Verify committed source-bound evidence
        run: node v3/@claude-flow/cli/benchmarks/context-delegation/verify.mjs
      - name: Reproduce deterministic before and after benchmark
        run: |
          node v3/@claude-flow/cli/benchmarks/context-delegation/run.mjs /tmp/context-delegation-results.json
          node v3/@claude-flow/cli/benchmarks/context-delegation/verify.mjs /tmp/context-delegation-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: context-delegation-results
          path: /tmp/context-delegation-results.json
