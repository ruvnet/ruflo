<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
<title id="title">ruPro • How agents learn from one run and improve the next</title>
<desc id="desc">A simulated learning loop. Claude studies a failed read. Codex tests a bounded retry. A reviewer approves the lesson for memory. In a second run, agents recall it and compare outcomes on eight fresh cases.</desc>
<defs>
  <linearGradient id="bg" x2=".8" y2="1"><stop stop-color="#38192b"/><stop offset=".34" stop-color="#151620"/><stop offset="1" stop-color="#101a21"/></linearGradient>
  <linearGradient id="spill"><stop stop-color="#68243f"/><stop offset=".48" stop-color="#512632"/><stop offset="1" stop-color="#173b46"/></linearGradient>
  <pattern id="brick" width="66" height="22" patternUnits="userSpaceOnUse"><path d="M0 1h66M0 12h66M17 1v11m33 0v11" fill="none" stroke="#100e18" stroke-width="2" opacity=".48"/></pattern>
  <filter id="halo" x="-35%" y="-50%" width="170%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.8"/></filter>
  <g id="sign" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="17" y="12" width="326" height="43" rx="11" stroke="#ff2686" stroke-width="2.7"/>
    <path d="M31 43V29m0 6q3-7 8-6m5 0v9q0 6 5 6t6-6v-9m8 15V22h6q8 0 8 6t-8 6h-6m20 10V29m0 6q3-7 8-6m5 7q0-7 6-7t6 7q0 8-6 8t-6-8" stroke="#ffd044" stroke-width="2.7"/>
    <g stroke="#49eff8" stroke-width="1.6"><circle cx="318" cy="33.5" r="15"/><path d="M307 31q5-5 11-2t10-1m-21 8q5-5 11-2t10-1m-19 7q4-3 9-1t9-1"/></g>
  </g>
<clipPath id="typed" clipPathUnits="userSpaceOnUse"><rect class="typing" x="42" y="257" width="158" height="22"/></clipPath>
</defs>
<style>
.scene{opacity:0}.poster{opacity:1}
@media(prefers-reduced-motion:no-preference){
.halo{animation:warm 7s ease-in-out infinite}
@keyframes warm{0%,100%{opacity:.64}12%{opacity:.9}18%{opacity:.72}45%,80%{opacity:1}}
.scene{animation:page 35s steps(1,end) var(--phase) infinite}
@keyframes page{0%{opacity:1}20%,100%{opacity:0}}
}
.after{opacity:1}.before{opacity:0}
@media(prefers-reduced-motion:no-preference){
.after{animation:reveal 7s linear infinite}.before{animation:pending 7s steps(1,end) infinite}
.ticket{animation:transfer 7s ease-in-out infinite}
.typing{animation:type 7s steps(17,end) infinite;transform-origin:42px 272px}
.bar{animation:grow 7s ease-out infinite;transform-box:fill-box;transform-origin:left}
.ping{animation:pulse 2.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes reveal{0%,45%{opacity:0}51%,100%{opacity:1}}
@keyframes pending{0%{opacity:1}49%,100%{opacity:0}}
@keyframes transfer{0%,12%{transform:translateX(0)}54%,100%{transform:translateX(167px)}}
@keyframes type{0%,12%{transform:scaleX(0)}43%,100%{transform:scaleX(1)}}
@keyframes grow{0%,36%{transform:scaleX(.12)}65%,100%{transform:scaleX(1)}}
@keyframes pulse{0%{opacity:.65;transform:scale(.65)}80%,100%{opacity:0;transform:scale(1.9)}}
}
</style>
<rect x="1" y="1" width="358" height="428" rx="12" fill="url(#bg)" stroke="#a34570"/>
<rect x="6" y="4" width="348" height="59" rx="10" fill="url(#spill)"/>
<rect x="6" y="4" width="348" height="59" rx="10" fill="url(#brick)"/>
<use xlink:href="#sign" class="halo" filter="url(#halo)" stroke-width="4"/>
<use xlink:href="#sign"/>
<path d="M145 10v5m104-5v5M145 53v5m104-5v5" stroke="#191520" stroke-width="6"/>
<g font-family="Menlo, Consolas, 'Liberation Mono', monospace">
<text x="130" y="38" fill="#ffebdb" font-size="14">~/workspace</text>
<g font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff5eb"><text x="19" y="89">Build agents that learn</text><text x="19" y="114">from one run to the next.</text></g>
<path d="M1 131h358" stroke="#443847"/><path d="M1 391h358" stroke="#443847"/><text x="18" y="414" fill="#bfbdcc" font-size="12">SIMULATED RUNS</text>
<g class="scene poster" style="--phase:-35s">
<text x="19" y="157" fill="#80eaf1" font-size="13" font-weight="bold">OBSERVE  /  RUN 01</text><text x="292" y="157" fill="#ffadd0" font-size="13">01/05</text>
<text x="18" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff5eb">Find the missed recovery</text>
<rect x="17" y="211" width="326" height="83" rx="7" fill="#2b2028" stroke="#9a674a"/><text x="30" y="235" fill="#ffd276" font-size="13" font-weight="bold">CHECKOUT  /  READ REQUEST</text><text x="30" y="264" fill="#fff5eb" font-size="20" font-weight="bold">GET /order timed out</text><text x="30" y="284" fill="#bfbdcc" font-size="14">Claude opens the failed trace.</text><circle class="ping" cx="319" cy="232" r="7" fill="none" stroke="#ffd276"/><circle cx="319" cy="232" r="3" fill="#ffd276"/><text x="23" y="322" fill="#fff5eb" font-size="15">First read</text><text x="181" y="322" fill="#80eaf1" font-size="15">Timed out</text><path d="M22 334h315" stroke="#443847"/><text x="23" y="360" fill="#fff5eb" font-size="15">Manual retry</text><text x="181" y="360" fill="#ffd276" font-size="15">Succeeded</text>
<rect x="209" y="407" width="21" height="4" rx="2" fill="#80eaf1"/><rect x="236" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="263" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="290" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="317" y="407" width="21" height="4" rx="2" fill="#544358"/>
</g>
<g class="scene" style="--phase:-28s">
<text x="19" y="157" fill="#80eaf1" font-size="13" font-weight="bold">PROPOSE  /  RUN 01</text><text x="292" y="157" fill="#ffadd0" font-size="13">02/05</text>
<text x="18" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff5eb">Turn a trace into a rule</text>
<rect x="17" y="214" width="152" height="72" rx="7" fill="#181924" stroke="#494153"/><rect x="190" y="214" width="153" height="72" rx="7" fill="#181924" stroke="#494153"/><text x="29" y="240" fill="#ffd276" font-size="18" font-weight="bold">Claude</text><text x="29" y="265" fill="#bfbdcc" font-size="14">Find pattern</text><text x="203" y="240" fill="#80eaf1" font-size="18" font-weight="bold">Codex</text><text x="203" y="265" fill="#bfbdcc" font-size="14">Test rule</text><path d="M50 304H296m-6-5 6 5-6 5" fill="none" stroke="#4796a0"/><g class="ticket"><rect x="26" y="290" width="51" height="26" rx="7" fill="#12414a" stroke="#56dce7"/><text x="37" y="308" fill="#80eaf1" font-size="14" font-weight="bold">GET</text></g><text x="21" y="343" fill="#fff5eb" font-size="14">Claude: retry a timed out read.</text><g class="after"><text x="21" y="368" fill="#80eaf1" font-size="14">Codex: only once. Skip writes.</text></g>
<rect x="209" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="236" y="407" width="21" height="4" rx="2" fill="#80eaf1"/><rect x="263" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="290" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="317" y="407" width="21" height="4" rx="2" fill="#544358"/>
</g>
<g class="scene" style="--phase:-21s">
<text x="19" y="157" fill="#80eaf1" font-size="13" font-weight="bold">EVALUATE  /  RUN 01</text><text x="292" y="157" fill="#ffadd0" font-size="13">03/05</text>
<text x="18" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff5eb">Test the rule and its limits</text>
<rect x="16" y="210" width="328" height="164" rx="7" fill="#10151c" stroke="#494153"/><text x="28" y="232" fill="#bfbdcc" font-size="14">shell  $ npx ruflo@latest init</text><text x="28" y="252" fill="#ffd276" font-size="14">Claude Code › /ruflo</text><text x="27" y="276" fill="#80eaf1" font-size="15">$</text><g clip-path="url(#typed)"><text x="42" y="276" fill="#fff5eb" font-size="15" font-weight="bold">npm test -- retry</text></g><path d="M28 290h302" stroke="#443847"/><g class="after"><text x="28" y="313" fill="#ffd276" font-size="15">PASS  GET timeout: retry once</text><text x="28" y="338" fill="#80eaf1" font-size="15">PASS  POST timeout: stop</text><text x="28" y="361" fill="#97edbe" font-size="15" font-weight="bold">PASS  second timeout: stop</text></g>
<rect x="209" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="236" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="263" y="407" width="21" height="4" rx="2" fill="#80eaf1"/><rect x="290" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="317" y="407" width="21" height="4" rx="2" fill="#544358"/>
</g>
<g class="scene" style="--phase:-14s">
<text x="19" y="157" fill="#80eaf1" font-size="13" font-weight="bold">REMEMBER  /  RUN 01</text><text x="292" y="157" fill="#ffadd0" font-size="13">04/05</text>
<text x="18" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff5eb">Save the tested lesson</text>
<rect x="16" y="209" width="328" height="92" rx="7" fill="#181924" stroke="#494153"/><text x="28" y="231" fill="#bfbdcc" font-size="13">MEMORY CANDIDATE  /  M17</text><text x="28" y="258" fill="#ffadd0" font-size="15">When: a GET times out</text><text x="28" y="283" fill="#97edbe" font-size="15">Then: retry once, then stop</text><text x="22" y="327" fill="#80eaf1" font-size="15" font-weight="bold">/ruflo room</text><text x="22" y="349" fill="#bfbdcc" font-size="14">Evidence: trace + 3 rule checks</text><g class="before"><text x="22" y="374" fill="#ffd276" font-size="15" font-weight="bold">Awaiting owner review</text></g><g class="after"><text x="22" y="374" fill="#97edbe" font-size="15" font-weight="bold">✓ Owner approved. M17 saved.</text></g>
<rect x="209" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="236" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="263" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="290" y="407" width="21" height="4" rx="2" fill="#80eaf1"/><rect x="317" y="407" width="21" height="4" rx="2" fill="#544358"/>
</g>
<g class="scene" style="--phase:-7s">
<text x="19" y="157" fill="#80eaf1" font-size="13" font-weight="bold">RECALL  /  RUN 02</text><text x="292" y="157" fill="#ffadd0" font-size="13">05/05</text>
<text x="18" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff5eb">Did memory help this time?</text>
<rect x="17" y="208" width="326" height="76" rx="7" fill="#181924" stroke="#494153"/><text x="29" y="233" fill="#bfbdcc" font-size="13">NEW PROJECT  /  CATALOG</text><g class="before"><text x="29" y="263" fill="#ffd276" font-size="20" font-weight="bold">Query memory</text></g><g class="after"><text x="29" y="263" fill="#97edbe" font-size="20" font-weight="bold">Recall M17</text></g><g transform="translate(196 251)"><rect width="130" height="8" rx="4" fill="#383143"/><rect class="bar" width="130" height="8" rx="4" fill="#97edbe"/></g><text x="20" y="317" fill="#fff5eb" font-size="15">Without M17</text><text x="174" y="317" fill="#80eaf1" font-size="15">6/8 passed</text><path d="M20 330h319" stroke="#443847"/><text x="20" y="355" fill="#fff5eb" font-size="15">With M17</text><text x="174" y="355" fill="#ffd276" font-size="15">8/8 passed</text><g class="after"><text x="20" y="377" fill="#bfbdcc" font-size="14">Same 8 new cases in both replays.</text></g>
<rect x="209" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="236" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="263" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="290" y="407" width="21" height="4" rx="2" fill="#544358"/><rect x="317" y="407" width="21" height="4" rx="2" fill="#80eaf1"/>
</g>
</g></svg>
