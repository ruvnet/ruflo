    <text x="20" y="129" fill="#f4efff" font-weight="bold" font-size="22"><tspan fill="#90dfe8">$</tspan> cat run-summary.log</text>
    <g class="line" style="--lag:0.3s"><path d="M20 156v16" stroke="#cbb3ff" stroke-width="2"/><text x="29" y="169" font-size="13" fill="#cbb3ff">FIXES</text><text x="98" y="169" font-size="16" fill="#e7e4ec">1 approved</text></g>
    <g class="line" style="--lag:0.8500000000000001s"><path d="M20 192v16" stroke="#8ee2b2" stroke-width="2"/><text x="29" y="205" font-size="13" fill="#8ee2b2">CHECKS</text><text x="98" y="205" font-size="16" fill="#e7e4ec">12 passed / 0 failed</text></g>
    <g class="line" style="--lag:1.4000000000000001s"><path d="M20 228v16" stroke="#8fdce6" stroke-width="2"/><text x="29" y="241" font-size="13" fill="#8fdce6">PROOF</text><text x="98" y="241" font-size="16" fill="#e7e4ec">Test log attached.</text></g>
    <g class="line" style="--lag:1.9500000000000002s"><path d="M20 264v16" stroke="#8ee2b2" stroke-width="2"/><text x="29" y="277" font-size="13" fill="#8ee2b2">SAVED</text><text x="98" y="277" font-size="16" fill="#e7e4ec">Decision filed in R42.</text></g>
    <path d="M260 362h76" stroke="#ba9af8" stroke-width="3"/>
  </g>
  <text x="20" y="322" fill="#94dbe3" font-size="15">~/workspace/r42 <tspan fill="#ceb0ff">$</tspan></text>
  <rect class="cursor" x="180" y="309" width="9" height="16" fill="#c4a7fa"/>
  <text x="20" y="387" fill="#c4b9d2" font-size="12">R42 / retry policy</text>
