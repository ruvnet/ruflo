<svg xmlns="http://www.w3.org/2000/svg" width="360" height="404" viewBox="0 0 360 404" role="img" aria-labelledby="title desc">
  <title id="title">ruPro terminal session R42</title>
  <desc id="desc">A simulated retry policy change moves from agent planning to a passing test, owner review, and a recorded decision.</desc>
  <defs>
    <linearGradient id="shell" x2=".88" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#201c30"/><stop offset=".45" stop-color="#10121a"/><stop offset="1" stop-color="#111019"/></linearGradient>
    <linearGradient id="rim"><stop stop-color="#9674b7"/><stop offset=".54" stop-color="#514361"/><stop offset="1" stop-color="#507780"/></linearGradient>
    <linearGradient id="command"><stop stop-color="#31273e"/><stop offset="1" stop-color="#1a1826"/></linearGradient>
  </defs>
  <style>
    .scene {opacity:0} .still {opacity:1}
    .meta {font-size:12px;fill:#c0adc9;letter-spacing:0.8px}
    .cmd {font-size:20px;font-weight:bold;fill:#f8f4ff}
    @media (prefers-reduced-motion:no-preference) {
      .scene {animation:scene 24s steps(1,end) var(--phase) infinite}
      .line {animation:print 24s linear calc(var(--phase) + var(--lag)) infinite}
      .cursor {animation:blink 1.2s steps(1,end) infinite}
      @keyframes scene {0%{opacity:1}25%,100%{opacity:0}}
      @keyframes print {0%{opacity:0;transform:translateY(3px)}1%,25%{opacity:1;transform:translateY(0)}26%,100%{opacity:0}}
      @keyframes blink {0%,100%{opacity:1}65%{opacity:0}}
    }
  </style>
  <rect x="1" y="1" width="358" height="402" rx="15" fill="url(#shell)" stroke="url(#rim)" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="17" y="16" width="34" height="32" rx="8" fill="#30263e" stroke="#79618b"/>
    <path d="m25 26 6 5-6 5m9 0h8" fill="none" stroke="#dfc3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="39" fill="#f4edfc" font-size="23" font-family="Arial, sans-serif" font-weight="bold">ruPro</text>
    <text x="134" y="37" fill="#bcaacb" font-size="14">/ tty01</text>
    <circle cx="258" cy="31" r="3" fill="#95dabe"/><text x="269" y="35" fill="#bed0cc" font-size="12">SIMULATED</text>
    <path d="M1 61h358M16 309h328M1 353h358" stroke="#393343"/>
    <path d="M21 180v114" stroke="#40384b"/>
    <g fill="#aba0b7" text-anchor="middle" font-size="13"><text x="42" y="383">Agents</text><text x="129" y="383">Terminal</text><text x="215" y="383">Review</text><text x="300" y="383">Analytics</text></g>
  <g class="scene" style="--phase:-24s">
    <text x="21" y="91" class="meta">R42  /  RETRY POLICY</text>
    <text x="339" y="91" text-anchor="end" class="meta">01 / 04</text>
    <rect x="16" y="107" width="328" height="50" rx="7" fill="url(#command)" stroke="#4c405f"/>
    <path d="m29 126 7 6-7 6" fill="none" stroke="#c6a0ff" stroke-width="2.5"/>
    <text x="47" y="139" class="cmd">tail -f agents.log</text>
    <g class="line" style="--lag:0.35s">
      <circle cx="21" cy="180" r="3" fill="#ccaaff"/>
      <text x="34" y="185" fill="#ccaaff" font-size="13" font-weight="bold">CLAUDE</text>
      <text x="96" y="185" fill="#eeeaf4" font-size="16">Trace request timeout</text>
    </g>
    <g class="line" style="--lag:0.90s">
      <circle cx="21" cy="218" r="3" fill="#92dbe0"/>
      <text x="34" y="223" fill="#92dbe0" font-size="13" font-weight="bold">PLAN</text>
      <text x="96" y="223" fill="#eeeaf4" font-size="16">Cap retries at three</text>
    </g>
    <g class="line" style="--lag:1.45s">
      <circle cx="21" cy="256" r="3" fill="#ccaaff"/>
      <text x="34" y="261" fill="#ccaaff" font-size="13" font-weight="bold">CODEX</text>
      <text x="96" y="261" fill="#eeeaf4" font-size="16">Implement backoff</text>
    </g>
    <g class="line" style="--lag:2.00s">
      <circle cx="21" cy="294" r="3" fill="#9cddbc"/>
      <text x="34" y="299" fill="#9cddbc" font-size="13" font-weight="bold">READY</text>
      <text x="96" y="299" fill="#eeeaf4" font-size="16">Patch ready to test</text>
    </g>
    <rect x="4" y="364" width="76" height="28" rx="7" fill="#332944"/>
    <text x="42" y="383" text-anchor="middle" fill="#ebdcff" font-size="13" font-weight="bold">Agents</text>
  </g>
  <g class="scene still" style="--phase:-18s">
    <text x="21" y="91" class="meta">R42  /  RETRY POLICY</text>
    <text x="339" y="91" text-anchor="end" class="meta">02 / 04</text>
    <rect x="16" y="107" width="328" height="50" rx="7" fill="url(#command)" stroke="#4c405f"/>
    <path d="m29 126 7 6-7 6" fill="none" stroke="#c6a0ff" stroke-width="2.5"/>
    <text x="47" y="139" class="cmd">npm test</text>
    <g class="line" style="--lag:0.35s">
      <circle cx="21" cy="180" r="3" fill="#efc595"/>
      <text x="34" y="185" fill="#efc595" font-size="13" font-weight="bold">WARN</text>
      <text x="96" y="185" fill="#eeeaf4" font-size="16">Attempt 1 timed out</text>
    </g>
    <g class="line" style="--lag:0.90s">
      <circle cx="21" cy="218" r="3" fill="#92dbe0"/>
      <text x="34" y="223" fill="#92dbe0" font-size="13" font-weight="bold">RETRY</text>
      <text x="96" y="223" fill="#eeeaf4" font-size="16">Attempt 2 after backoff</text>
    </g>
    <g class="line" style="--lag:1.45s">
      <circle cx="21" cy="256" r="3" fill="#9cddbc"/>
      <text x="34" y="261" fill="#9cddbc" font-size="13" font-weight="bold">PASS</text>
      <text x="96" y="261" fill="#eeeaf4" font-size="16">Request recovered</text>
    </g>
    <g class="line" style="--lag:2.00s">
      <circle cx="21" cy="294" r="3" fill="#9cddbc"/>
      <text x="34" y="299" fill="#9cddbc" font-size="13" font-weight="bold">EXIT 0</text>
      <text x="96" y="299" fill="#eeeaf4" font-size="16">12 of 12 checks passed</text>
    </g>
    <rect x="91" y="364" width="76" height="28" rx="7" fill="#332944"/>
    <text x="129" y="383" text-anchor="middle" fill="#ebdcff" font-size="13" font-weight="bold">Terminal</text>
  </g>
  <g class="scene" style="--phase:-12s">
    <text x="21" y="91" class="meta">R42  /  RETRY POLICY</text>
    <text x="339" y="91" text-anchor="end" class="meta">03 / 04</text>
    <rect x="16" y="107" width="328" height="50" rx="7" fill="url(#command)" stroke="#4c405f"/>
    <path d="m29 126 7 6-7 6" fill="none" stroke="#c6a0ff" stroke-width="2.5"/>
    <text x="47" y="139" class="cmd">git diff -- retry.ts</text>
    <g class="line" style="--lag:0.35s">
      <circle cx="21" cy="180" r="3" fill="#92dbe0"/>
      <text x="34" y="185" fill="#92dbe0" font-size="13" font-weight="bold">FILE</text>
      <text x="96" y="185" fill="#eeeaf4" font-size="16">retry.ts</text>
    </g>
    <g class="line" style="--lag:0.90s">
      <circle cx="21" cy="218" r="3" fill="#efc595"/>
      <text x="34" y="223" fill="#efc595" font-size="13" font-weight="bold">−</text>
      <text x="96" y="223" fill="#eeeaf4" font-size="16">maxAttempts = 1</text>
    </g>
    <g class="line" style="--lag:1.45s">
      <circle cx="21" cy="256" r="3" fill="#9cddbc"/>
      <text x="34" y="261" fill="#9cddbc" font-size="13" font-weight="bold">+</text>
      <text x="96" y="261" fill="#eeeaf4" font-size="16">maxAttempts = 3</text>
    </g>
    <g class="line" style="--lag:2.00s">
      <circle cx="21" cy="294" r="3" fill="#ccaaff"/>
      <text x="34" y="299" fill="#ccaaff" font-size="13" font-weight="bold">OWNER</text>
      <text x="96" y="299" fill="#eeeaf4" font-size="16">Patch approved</text>
    </g>
    <rect x="177" y="364" width="76" height="28" rx="7" fill="#332944"/>
    <text x="215" y="383" text-anchor="middle" fill="#ebdcff" font-size="13" font-weight="bold">Review</text>
  </g>
  <g class="scene" style="--phase:-6s">
    <text x="21" y="91" class="meta">R42  /  RETRY POLICY</text>
    <text x="339" y="91" text-anchor="end" class="meta">04 / 04</text>
    <rect x="16" y="107" width="328" height="50" rx="7" fill="url(#command)" stroke="#4c405f"/>
    <path d="m29 126 7 6-7 6" fill="none" stroke="#c6a0ff" stroke-width="2.5"/>
    <text x="47" y="139" class="cmd">cat run-summary.log</text>
    <g class="line" style="--lag:0.35s">
      <circle cx="21" cy="180" r="3" fill="#ccaaff"/>
      <text x="34" y="185" fill="#ccaaff" font-size="13" font-weight="bold">FIXES</text>
      <text x="96" y="185" fill="#eeeaf4" font-size="16">1 patch approved</text>
    </g>
    <g class="line" style="--lag:0.90s">
      <circle cx="21" cy="218" r="3" fill="#9cddbc"/>
      <text x="34" y="223" fill="#9cddbc" font-size="13" font-weight="bold">CHECKS</text>
      <text x="96" y="223" fill="#eeeaf4" font-size="16">12 passed, 0 failed</text>
    </g>
    <g class="line" style="--lag:1.45s">
      <circle cx="21" cy="256" r="3" fill="#92dbe0"/>
      <text x="34" y="261" fill="#92dbe0" font-size="13" font-weight="bold">PROOF</text>
      <text x="96" y="261" fill="#eeeaf4" font-size="16">Test log attached</text>
    </g>
    <g class="line" style="--lag:2.00s">
      <circle cx="21" cy="294" r="3" fill="#9cddbc"/>
      <text x="34" y="299" fill="#9cddbc" font-size="13" font-weight="bold">SAVED</text>
      <text x="96" y="299" fill="#eeeaf4" font-size="16">Decision filed in R42</text>
    </g>
    <rect x="262" y="364" width="76" height="28" rx="7" fill="#332944"/>
    <text x="300" y="383" text-anchor="middle" fill="#ebdcff" font-size="13" font-weight="bold">Analytics</text>
  </g>
    <text x="20" y="336" fill="#9cdce1" font-size="15">~/workspace/r42</text><text x="172" y="336" fill="#d6b5ff" font-size="16">$</text>
    <rect class="cursor" x="190" y="323" width="8" height="15" fill="#d6b5ff"/>
  </g>
</svg>
