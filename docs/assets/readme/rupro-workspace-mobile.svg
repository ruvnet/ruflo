<svg xmlns="http://www.w3.org/2000/svg" width="360" height="408" viewBox="0 0 360 408" role="img" aria-labelledby="title desc">
  <title id="title">ruPro terminal · retry policy</title>
  <desc id="desc">Simulated session R42. Claude plans a retry, Codex implements backoff, twelve tests pass, and the owner approves the patch.</desc>
  <style>
    .scene { opacity: 0 }
    .still { opacity: 1 }
    @media (prefers-reduced-motion: no-preference) {
      .scene { animation: scene 24s steps(1,end) var(--offset) infinite }
      .line { animation: scene 24s steps(1,end) calc(var(--offset) + var(--lag)) infinite }
      .cursor { animation: blink 1.2s steps(1,end) infinite }
      @keyframes scene { 0% { opacity: 1 } 25%,100% { opacity: 0 } }
      @keyframes blink { 0%,100% { opacity: 1 } 65% { opacity: 0 } }
    }
  </style>
  <rect x="1" y="1" width="358" height="406" rx="12" fill="#101018" stroke="#655477"/>
  <path d="M2 43h356M20 145h320M20 292h320" stroke="#373043"/>
  <g font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace">
  <path d="m17 17 6 5-6 5m10 0h7" stroke="#c5a6fe" stroke-width="2" fill="none"/>
  <text x="45" y="27" fill="#f0eafa" font-size="15" font-weight="bold">ruPro / tty01</text>
  <text x="341" y="27" text-anchor="end" fill="#c4aedf" font-size="12">EARLY ACCESS</text>
  <g class="scene " style="--offset:-24s">
    <text x="20" y="84" fill="#cab2fa" font-size="13">01/04  /  AGENTS</text>
    <text x="20" y="129" fill="#f4efff" font-weight="bold" font-size="22"><tspan fill="#90dfe8">$</tspan> tail -f agents.log</text>
    <g class="line" style="--lag:0.3s"><path d="M20 156v16" stroke="#cbb3ff" stroke-width="2"/><text x="29" y="169" font-size="13" fill="#cbb3ff">CLAUDE</text><text x="98" y="169" font-size="16" fill="#e7e4ec">Trace request timeout.</text></g>
    <g class="line" style="--lag:0.8500000000000001s"><path d="M20 192v16" stroke="#8fdce6" stroke-width="2"/><text x="29" y="205" font-size="13" fill="#8fdce6">PLAN</text><text x="98" y="205" font-size="16" fill="#e7e4ec">Limit retries to three.</text></g>
    <g class="line" style="--lag:1.4000000000000001s"><path d="M20 228v16" stroke="#cbb3ff" stroke-width="2"/><text x="29" y="241" font-size="13" fill="#cbb3ff">CODEX</text><text x="98" y="241" font-size="16" fill="#e7e4ec">Implement backoff.</text></g>
    <g class="line" style="--lag:1.9500000000000002s"><path d="M20 264v16" stroke="#8ee2b2" stroke-width="2"/><text x="29" y="277" font-size="13" fill="#8ee2b2">READY</text><text x="98" y="277" font-size="16" fill="#e7e4ec">Patch ready for tests.</text></g>
    <path d="M20 362h76" stroke="#ba9af8" stroke-width="3"/>
  </g>
  <g class="scene still" style="--offset:-18s">
    <text x="20" y="84" fill="#cab2fa" font-size="13">02/04  /  TERMINAL</text>
    <text x="20" y="129" fill="#f4efff" font-weight="bold" font-size="22"><tspan fill="#90dfe8">$</tspan> npm test</text>
    <g class="line" style="--lag:0.3s"><path d="M20 156v16" stroke="#efc38d" stroke-width="2"/><text x="29" y="169" font-size="13" fill="#efc38d">WARN</text><text x="98" y="169" font-size="16" fill="#e7e4ec">attempt 1/3  timeout</text></g>
    <g class="line" style="--lag:0.8500000000000001s"><path d="M20 192v16" stroke="#8fdce6" stroke-width="2"/><text x="29" y="205" font-size="13" fill="#8fdce6">RETRY</text><text x="98" y="205" font-size="16" fill="#e7e4ec">attempt 2/3  backoff</text></g>
    <g class="line" style="--lag:1.4000000000000001s"><path d="M20 228v16" stroke="#8ee2b2" stroke-width="2"/><text x="29" y="241" font-size="13" fill="#8ee2b2">PASS</text><text x="98" y="241" font-size="16" fill="#e7e4ec">request recovered</text></g>
    <g class="line" style="--lag:1.9500000000000002s"><path d="M20 264v16" stroke="#8ee2b2" stroke-width="2"/><text x="29" y="277" font-size="13" fill="#8ee2b2">EXIT 0</text><text x="98" y="277" font-size="16" fill="#e7e4ec">12/12 checks passed</text></g>
