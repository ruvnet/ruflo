<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="t d"><title id="t">@claude-flow/memory HNSW quickstart</title><desc id="d">Three 8-dimensional vectors doc-a, doc-b and doc-c are added to an HNSWIndex; a cosine query returns doc-a at distance 0 and doc-b at distance 0.0061, the output of the README quickstart run on Node 22.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.h{fill:#f2f6ff;font-size:20px;font-weight:700}.s{fill:#b8c7da;font-size:13px}.m{fill:#f2f6ff;font-size:13px}.m text,text.m{font-family:Menlo,Consolas,monospace}.k{fill:#5cf2c3;font-size:11px;letter-spacing:2px}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.a1,.a2,.a3,.q,.r1,.r2{opacity:0;animation:6s ease-in-out infinite}.a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}.q{animation-name:q}.r1{animation-name:r1}.r2{animation-name:r2}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes a1{8%,100%{opacity:1}0%{opacity:0}}@keyframes a2{0%,15%{opacity:0}23%,100%{opacity:1}}@keyframes a3{0%,30%{opacity:0}38%,100%{opacity:1}}@keyframes q{0%,48%{opacity:0}55%,100%{opacity:1}}@keyframes r1{0%,62%{opacity:0}70%,100%{opacity:1}}@keyframes r2{0%,74%{opacity:0}82%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<rect width="880" height="220" rx="14" fill="#0c1324"/>
<text x="28" y="38" class="k">AGENT MEMORY · HNSW</text><text x="28" y="66" class="h">@claude-flow/memory</text><text x="28" y="88" class="s">Vector memory for agents: add, search, persist.</text>
<g class="m"><text x="28" y="128" class="a1">addPoint('doc-a', [1,0,0,…])</text><text x="28" y="152" class="a2">addPoint('doc-b', [0.9,0.1,0,…])</text><text x="28" y="176" class="a3">addPoint('doc-c', [0,1,0,…])</text></g>
<path class="wire" d="M300 150 H380"/>
<rect x="385" y="104" width="150" height="92" rx="10" fill="#162238" stroke="#374354"/><text x="460" y="134" text-anchor="middle" class="s">HNSWIndex</text><text x="460" y="154" text-anchor="middle" class="s">dim 8 · cosine</text><text x="460" y="174" text-anchor="middle" class="s">M 16</text>
<g class="q"><circle cx="460" cy="86" r="6" fill="#ffbe73"/><text x="474" y="90" class="m">search(query, 2)</text></g>
<path class="wire" d="M540 150 H610"/>
<g class="m"><text x="618" y="138" class="r1">doc-a  distance 0</text><text x="618" y="166" class="r2">doc-b  distance 0.0061</text></g>
</svg>
